title: 'The customer describes their buyers: both the company and the person are saved'
agent: onboarding
setup:
  customer: klinikflow-dental
  brief:
    icp:
      countries: []
      industries: []
      titles: []
      triggers: []
turns:
- Mette here (rep-1, our admin). We sell to private dental clinics in Norway, usually 3 to 30 people. The clinic
  owner or the practice manager decides. They buy when they open a new clinic or have a lot of no-shows. Set that
  up as our ICP.
approvals:
  default: approve
expect:
  called:
  - update_brief
  brief:
    icp.countries:
    - 'NO'
    icp.titles: ~owner
    icp.industries: ~dental
  logs_follow_schema: true
