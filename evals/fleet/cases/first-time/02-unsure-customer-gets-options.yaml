turns:
- 'Hi, I''m Mette (rep-1). We just signed up. We''re Bokfør: we do the bookkeeping, VAT and payroll for small companies,
  with a named accountant. I honestly don''t know who our best customers are, or whether our pricing makes sense.
  Where do we start?'
- We charge EUR 350 a month with a minimum of 6 months, plus a one-off EUR 500 setup. Is that a sensible structure?
- OK, save that pricing as it is, no auto-close for now.
- For the ICP, suggest two or three options for a bookkeeping service like ours, covering the company and the person.
- Go with your first option. Save it.
- Where are we now, what's still missing?
