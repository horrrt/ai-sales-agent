  - update_brief
  - review_pricing
  - add_team_member
  - get_setup_status
  - find_leads
  - add_lead
  - save_draft
  asked_person:
  - update_brief
  - add_team_member
  - record_approval
  brief:
    product_info: ~stock
    pricing.plans: ~290
    pricing.adjustments: ~employees_max
    auto_close.enabled: true
    icp.countries: ~DK
    icp.titles: ~COO
    sender.email: mette@lagerlys.sandbox.test
  lead:
    N-01:
      status: active
    N-03:
      status: lost
  final_mentions:
  - Shop
  logs_follow_schema: true
